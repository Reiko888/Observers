[config]
schemaVersion = "0.0.1"

[general]
repository = "https://thunderstore.io"

[package]
namespace = "Reiko888"
name = "Observer"
versionNumber = "1.0.0"
description = "This mod adds a unique enemy that becomes more aggressive as more scrap is collected, acting as a guard of the moon's facilities. This enemy incorporates different monster appearances, making every encounter unique! [V81 COMPATIBLE]"
websiteUrl = "https://github.com/Reiko888/Observers"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2305"
Evaisa-HookGenPatcher = "0.0.5"
Evaisa-LethalLib = "1.2.0"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./Packages"

[[build.copy]]
source = "./Reiko888.Observers.dll"
target = "plugins/Observer/"

[[build.copy]]
source = "./observers"
target = "plugins/Observer/"

[[build.copy]]
source = "./CHANGELOG.md"
target = "/"

[publish]
communities = [ "lethal-company", ]
[publish.categories]
# Get the list of categories from https://thunderstore.io/api/experimental/community/lethal-company/category/
lethal-company = [ "bepinex", "clientside", "serverside", "monsters", "mods", ]